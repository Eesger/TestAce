[project]
name = "x-bookmark-archiver"
version = "0.1.0"
description = "Sync X.com bookmarks, extract linked articles, and search them semantically."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "authlib>=1.3",
    "python-dotenv>=1.0",
    "pydantic-settings>=2.3",
    "trafilatura>=1.12",
    "sentence-transformers>=3.0",
    "numpy>=1.26",
    "APScheduler>=3.10",
    "click>=8.1",
    "rich>=13.7",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
xarchiver = "xarchiver.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xarchiver"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
